<html>
    <body>
        <div class="login">
            <h1>Student Exam Performance Indicator</h1>

            <form action="{{url_for('predict_datapoint')}}" method="post">
                <h1>
                    <legend>Student Exam Performance Prediction</legend>
                </h1>
                <div class="mb-3">
                    <label class="form-label">Gender</label>
                    <select class="form-control" name="gender" placeholder="Enter you Gender" required>
                        <option class="placeholder" selected disabled value="">Select your Gender</option>
                        <option value="male">
                            Male
                        </option>
                        <option value="female">
                            Female
                        </option>
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label">Race or Ethnicity</label>
                    <select class="form-label" name="race/ethnicity" placeholder="Enter your ethnicity" required>
                        <option class="placeholder" selected disabled value="">Select Ethnicity</option>
                        <option value="group A">
                            Group A
                        </option>
                        <option value="group B">
                            Group B
                        </option>
                        <option value="group C">
                            Group C
                        </option>
                        <option value="group D">
                            Group D
                        </option>
                        <option value="group E">
                            Group E
                        </option>

                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label">Parental Label of Education</label>
                    <select class="form-label" name="parental level of education" 
                        placeholder="Enter your parental education" required>
                        <option class="placeholder" selected disabled value="">Select Parental Education</option>
                        <option value="some high school">
                            Some High School
                        </option>
                        <option value="high school">
                            High School
                        </option>
                        <option value="some college">
                            Some College
                        </option>
                        <option value="associate's degree">
                            Associate's Degree
                        </option>
                        <option value="bachelor's degree">
                            Bachelor's Degree
                        </option>
                        <option value="master's degree">
                            Master's Degree
                        </option>
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label">Lunch Type</label>
                    <select class="form-control" name="lunch" placeholder="Enter your lunch " required>
                        <option class="placeholder" selected disabled value="">Select Lunch Type</option>
                        <option value="standard">
                            Standard
                        </option>
                        <option value="free/reduced">
                            Free/Reduced
                        </option>
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label">Test Preparation Course</label>
                    <select class="form-control" name="test preparation course" placeholder="Enter your course" required>
                        <option class="placeholder" selected disabled value="">Select Test_Course</option>
                        <option value="none">
                            None
                        </option>
                        <option value="completed">
                            Completed
                        </option>
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label">Math Score out of 100</label>
                    <input type="number" class="form-control" name="math score" 
                        placeholder="Enter your Math score"  min='0' max='100'>
                </div>
                <div class="mb-3">
                    <label class="form-label">Reading Score out of 100</label>
                    <input type="number" class="form-control" name="reading score" 
                        placeholder="Enter your reading score"  min='0' max="100">
                </div>
                <div class="mb-3">
                    <label class="form-label">Writing Score</label>
                    <input type="number" class="form-control" name="writing score" 
                        placeholder="Enter your Writing score" min='0' max='100'>
                </div>
                <div class="mb-3">
                    <input class="btn btn-primary" type="submit" value="Predict your Maths Score" required>
                </div>

            </form>
            <h2>
                The prediction is {{results}} 
            </h2>
    </body>
</html>
